<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSME login · {{ a.applicant_name }} · {{ bank_name }}</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --surface-2: #f3f2ef; --card: #ffffff; --line: #e2e1dc;
    --text: #0b0b0b; --text-2: #52514e; --muted: #7a7974;
    --accent: #2a78d6; --accent-ink: #ffffff;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
    --series-1: #2a78d6; --series-2: #eb6834;
    --age-1: #86b6ef; --age-2: #5598e7; --age-3: #2a78d6; --age-4: #1c5cab; --age-5: #104281; --age-6: #0d366b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--text); font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  a.btn { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line);
    background: #fff; color: var(--text); cursor: pointer; text-decoration: none; }
  .panel { background: var(--surface-2); border-radius: 8px; padding: 16px; }
  .k { font-size: 12px; color: var(--text-2); }
  .v { font: 600 16px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .02em; margin: 2px 0 12px; }
  .muted { color: var(--text-2); font-size: 12px; }
</style>
</head>
<body>
<main>
<h1>MSME login for {{ a.applicant_name }}</h1>
<div class="panel">
  <div class="k">Username</div><div class="v">{{ username }}</div>
  <div class="k">Password</div><div class="v">{{ password }}</div>
</div>
<p class="muted">Share these with the applicant so they can view their own analysis at <code>/msme</code>.
  This password is shown only this once — it isn't stored anywhere in the clear; resetting generates a new one.</p>
<p><a class="btn" href="/bank/applications/{{ a.id }}">Back to application</a></p>
</main>
</body>
</html>
