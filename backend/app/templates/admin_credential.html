<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ heading }} · Admin</title>
<style>
  :root {
    color-scheme: light;
    --surface: #f5f6f8; --surface-2: #eceef3; --card: #ffffff; --line: #e2e5eb;
    --text: #101828; --text-2: #475467; --muted: #667085;
    --accent: #3b5bdb; --accent-ink: #ffffff; --brand: #111c3a;
    --good: #12a150; --warning: #f2a900; --serious: #ea6b2d; --critical: #d92d20;
    --series-1: #3b5bdb; --series-2: #0fa3a3;
    --age-1: #c5cff8; --age-2: #9aabf1; --age-3: #6f86e8; --age-4: #3b5bdb; --age-5: #2b43a8; --age-6: #1b2c75;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--text); font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  a.btn { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line);
    background: #fff; color: var(--text); cursor: pointer; text-decoration: none; }
  .panel { background: var(--surface-2); border-radius: 8px; padding: 16px; }
  .k { font-size: 12px; color: var(--text-2); }
  .v { font: 600 16px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .02em; margin: 2px 0 12px; }
  .muted { color: var(--text-2); font-size: 12px; }
</style>
<link rel="stylesheet" href="/static/app.css?v=2">
</head>
<body>
<main>
<h1>{{ heading }}</h1>
<div class="panel">
  <div class="k">Username</div><div class="v">{{ username }}</div>
  <div class="k">Password</div><div class="v">{{ password }}</div>
</div>
<p class="muted">This password is shown only this once — it isn't stored anywhere in the clear; resetting generates a new one.</p>
<p><a class="btn" href="{{ back_url }}">Back</a></p>
</main>
</body>
</html>
